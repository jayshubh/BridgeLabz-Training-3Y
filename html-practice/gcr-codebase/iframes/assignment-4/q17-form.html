<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>
    <h1>Submit Form</h1>

    <form action="q17-result.html" target="result-frame">
        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name">

        <button type="submit">Submit</button>
    </form>

    <br>

    <iframe
        name="result-frame"
        src="q17-result.html"
        width="500"
        height="150"
        title="Form Result">
    </iframe>
</body>
</html>
