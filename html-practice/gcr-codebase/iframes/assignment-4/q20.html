<!DOCTYPE html>
<html lang="en">
<head>
    <!-- title defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- description provides a short description of the webpage -->
    <meta name="description" content="A page demonstrating important HTML head elements">

    <!-- author identifies the creator of the webpage -->
    <meta name="author" content="Jay Kashyap">

    <!-- base sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- link can be used to connect external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- style contains CSS rules; empty here as requested -->
    <style>
    </style>

    <!-- script is used for JavaScript; empty here as requested -->
    <script>
    </script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates important elements used inside the head section.</p>
</body>
</html>
