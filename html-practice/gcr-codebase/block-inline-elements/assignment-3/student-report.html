<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

<h1>ABC School</h1>

<table border="1">
    <caption>Student Marks Report</caption>

    <tr>
        <th title="Name of Subject">Subject</th>
        <th>Marks</th>
    </tr>

    <tr>
        <td>English</td>
        <td>85</td>
    </tr>
    <tr>
        <td>Mathematics</td>
        <td>90</td>
    </tr>
    <tr>
        <td>Science</td>
        <td>88</td>
    </tr>
    <tr>
        <td>Computer</td>
        <td>95</td>
    </tr>
    <tr>
        <td>Hindi</td>
        <td>80</td>
    </tr>

    <tr>
        <td colspan="1">Total</td>
        <td>438</td>
    </tr>

    <tr>
        <td rowspan="1">Percentage</td>
        <td>87.6%</td>
    </tr>
</table>

</body>
</html>
