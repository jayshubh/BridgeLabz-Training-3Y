<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection Page</title>
</head>
<body>

<h1>My Selection</h1>

<label for="country">Country:</label>
<select id="country">
    <option selected>India</option>
    <option>USA</option>
    <option>Japan</option>
</select>

<br><br>

<label for="state">State:</label>
<select id="state">
    <option selected>Uttar Pradesh</option>
    <option>Delhi</option>
    <option>Maharashtra</option>
</select>

<br><br>

<label for="city">City:</label>
<select id="city">
    <option selected>Agra</option>
    <option>Lucknow</option>
    <option>Varanasi</option>
</select>

<br><br>

<label for="place">Favorite Tourist Place:</label>
<select id="place">
    <option selected>Taj Mahal</option>
    <option>Gateway of India</option>
    <option>India Gate</option>
</select>

<p>
    My choices are India, Uttar Pradesh, Agra and Taj Mahal.
</p>

</body>
</html>
