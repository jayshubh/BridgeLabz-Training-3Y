<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Responsive Image Filter Gallery</title><link rel="stylesheet" href="responsive-image-filter-gallery.css"></head>
<body>
  <main class="page"><header><p class="eyebrow">Question 1 - Responsive image filter gallery</p><h1>Filter field notes</h1><p>Hover over each image to clear its CSS filter.</p></header>
    <section class="gallery" aria-label="Filtered image gallery">
      <figure><img class="blur" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800&q=80" alt="Mountain lake"><figcaption>Blur</figcaption></figure>
      <figure><img class="gray" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800&q=80" alt="Valley cabin"><figcaption>Grayscale</figcaption></figure>
      <figure><img class="sepia" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&q=80" alt="Mountain ridge"><figcaption>Sepia</figcaption></figure>
      <figure><img class="bright" src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&q=80" alt="Sunny landscape"><figcaption>Brightness</figcaption></figure>
      <figure><img class="contrast" src="https://images.unsplash.com/photo-1511497584788-876760111969?w=800&q=80" alt="Forest path"><figcaption>Contrast</figcaption></figure>
      <figure><img class="hue" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800&q=80&sat=-30" alt="Blue lake and peaks"><figcaption>Hue rotate</figcaption></figure>
    </section>
  </main>
</body>
</html>
