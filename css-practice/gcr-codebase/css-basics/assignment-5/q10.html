<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Webpage</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

<header>
    <h1>My Website</h1>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="home" class="hero">
    <div>
        <h2>Welcome to My Website</h2>
        <p>Building modern web experiences.</p>
    </div>
</section>

<section id="about" class="about">
    <div>
        <h2>About Me</h2>
        <p>I am a computer science student interested in web development and cybersecurity.</p>
    </div>
    <img src="https://picsum.photos/400/300" alt="About Image">
</section>

<section id="services">
    <h2>Services</h2>
    <div class="services">
        <article>Web Development</article>
        <article>Cybersecurity</article>
        <article>Programming</article>
    </div>
</section>

<section id="contact">
    <h2>Contact</h2>
    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <textarea placeholder="Message"></textarea>
        <button>Submit</button>
    </form>
</section>

<footer>
    <p>&copy; 2026 Jay Kashyap</p>
</footer>

</body>
</html>
