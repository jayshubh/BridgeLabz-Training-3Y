<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
<h1>Choose Your Plan</h1>

<main class="pricing">
    <article class="plan">
        <h2>Basic</h2>
        <p class="price">?299/month</p>
        <ul>
            <li>5 Projects</li>
            <li>Basic Support</li>
            <li>10 GB Storage</li>
        </ul>
        <a href="#">Choose Plan</a>
    </article>

    <article class="plan popular">
        <h2>Standard</h2>
        <p class="price">?599/month</p>
        <ul>
            <li>15 Projects</li>
            <li>Priority Support</li>
            <li>50 GB Storage</li>
        </ul>
        <a href="#">Choose Plan</a>
    </article>

    <article class="plan">
        <h2>Premium</h2>
        <p class="price">?999/month</p>
        <ul>
            <li>Unlimited Projects</li>
            <li>24/7 Support</li>
            <li>100 GB Storage</li>
        </ul>
        <a href="#">Choose Plan</a>
    </article>
</main>
</body>
</html>
