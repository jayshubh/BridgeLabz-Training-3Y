<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice</title><link rel="stylesheet" href="q2.css">
</head>
<body>
  <main class="layout">
    <header><p class="eyebrow">Sizing in context</p><h1>Height &amp; Width Practice</h1></header>
    <section class="size-row" aria-label="Boxes with different dimensions">
      <article class="size-box pixels"><h2>Pixels</h2><p>240px wide<br>180px tall</p></article>
      <article class="size-box relative"><h2>Percent</h2><p>70% width<br>min-height: 22vh</p></article>
      <article class="size-box viewport"><h2>Viewport</h2><p>26vw wide<br>max-width: 300px</p><div class="overflow-note">This text stays contained when content grows.</div></article>
    </section>
  </main>
</body>
</html>
