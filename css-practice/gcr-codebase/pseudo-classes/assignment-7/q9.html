<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Outline and Focus Form</title><link rel="stylesheet" href="q9.css"></head>
<body>
  <main class="form-page"><section class="form-intro"><p class="label">A quiet form</p><h1>Tell us what you noticed.</h1><p>Every field has a clear focus state for comfortable keyboard navigation.</p></section>
    <form><label for="name">Your name<input id="name" type="text" placeholder="e.g. Maya Patel"></label><label for="email">Email address<input id="email" type="email" placeholder="you@example.com"></label><label for="message">Your note<textarea id="message" rows="5" placeholder="Write a few lines..."></textarea></label><button type="submit">Send note</button></form>
  </main>
</body>
</html>
