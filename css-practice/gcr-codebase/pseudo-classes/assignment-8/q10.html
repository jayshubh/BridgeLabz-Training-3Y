<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mini User Interface</title><link rel="stylesheet" href="q10.css"></head>
<body>
  <header class="site-header"><a class="brand" href="#home">Fieldnote</a><nav aria-label="Main navigation"><a class="active" href="#home">Home</a><a href="#library">Library</a><a href="#about">About</a></nav></header>
  <main id="home"><section class="ui-card"><div class="card-copy"><p class="label">Daily prompt</p><h1>Make the ordinary visible.</h1><p>Save a thought, a detail, or a question worth returning to.</p><form><label for="note">Your note</label><textarea id="note" rows="4" placeholder="Start writing..."></textarea><div class="form-actions"><button type="submit">Save note</button><button class="secondary" type="button">Preview</button></div></form></div><img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?w=900&q=80" alt="Notebook and pen on a desk"></section></main>
  <footer>Fieldnote - a small place for lasting ideas</footer>
</body>
</html>
