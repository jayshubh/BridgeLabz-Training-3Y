<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Tooltips</title><link rel="stylesheet" href="q2.css"></head>
<body>
  <main class="page"><header><p class="label">Hover glossary</p><h1>Words with a little more to say</h1><p>Hover or focus each term to reveal its tooltip.</p></header>
    <section class="tooltip-row" aria-label="Tooltip examples">
      <div class="tip-wrap" tabindex="0"><span class="term">Flex</span><span class="tooltip">Aligns items along one dimension.</span></div>
      <div class="tip-wrap" tabindex="0"><span class="term">Grid</span><span class="tooltip">Organizes content in rows and columns.</span></div>
      <div class="tip-wrap" tabindex="0"><span class="term">Flow</span><span class="tooltip">The natural order of elements on a page.</span></div>
    </section>
  </main>
</body>
</html>
