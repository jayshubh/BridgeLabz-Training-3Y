<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Choose Your Plan</h1>

<main class="pricing">

    <section class="card">
        <h2>Basic</h2>
        <h3>₹499</h3>
        <p>HTML & CSS</p>
        <p>Beginner Projects</p>
        <button>Choose Plan</button>
    </section>

    <section class="card popular">
        <span>POPULAR</span>
        <h2>Pro</h2>
        <h3>₹999</h3>
        <p>Full Stack Basics</p>
        <p>Java & DSA</p>
        <button>Choose Plan</button>
    </section>

    <section class="card">
        <h2>Premium</h2>
        <h3>₹1499</h3>
        <p>Cyber Security</p>
        <p>Advanced Projects</p>
        <button>Choose Plan</button>
    </section>

</main>

</body>
</html>
