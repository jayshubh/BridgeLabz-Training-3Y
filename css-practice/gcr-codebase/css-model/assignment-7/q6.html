<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS Transformations</title><link rel="stylesheet" href="q6.css"></head>
<body>
  <main><header><p>Motion without JavaScript</p><h1>Transformation studio</h1></header>
    <section class="transform-row" aria-label="CSS transformation examples">
      <figure><div class="transform-box rotate">A</div><figcaption>rotate()</figcaption></figure>
      <figure><div class="transform-box scale">B</div><figcaption>scale()</figcaption></figure>
      <figure><div class="transform-box translate">C</div><figcaption>translate()</figcaption></figure>
      <figure><div class="transform-box skew">D</div><figcaption>skew()</figcaption></figure>
    </section>
  </main>
</body>
</html>
