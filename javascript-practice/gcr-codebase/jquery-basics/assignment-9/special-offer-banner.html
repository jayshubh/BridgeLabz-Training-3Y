<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Special Offer Banner</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    .banner { padding: 20px; margin: 8px 0; color: white; background: #2c7be5; }
    .banner:nth-of-type(3) { background: #20c997; }
    .banner:nth-of-type(4) { background: #fd7e14; }
    .banner:nth-of-type(5) { background: #6f42c1; }
    .banner:nth-of-type(6) { background: #dc3545; }
  </style>
</head>
<body>
  <main>
    <h1>Special Offers</h1>
    <button id="hide" type="button">Hide</button><button id="show" type="button">Show</button>
    <button id="slideUp" type="button">Slide Up</button><button id="slideDown" type="button">Slide Down</button>
    <button id="fadeOut" type="button">Fade Out</button><button id="fadeIn" type="button">Fade In</button>
    <section id="banners">
      <article class="banner">20% off Java courses</article>
      <article class="banner">Free webinar this week</article>
      <article class="banner">Bundle discount for 3 courses</article>
      <article class="banner">Student referral reward</article>
      <article class="banner">Weekend bootcamp sale</article>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="special-offer-banner.js"></script>
</body>
</html>
