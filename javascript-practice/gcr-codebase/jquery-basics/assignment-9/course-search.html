<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Courses</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    #search { width: 300px; padding: 8px; }
    .course { padding: 10px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <main>
    <h1>Course Search</h1>
    <input id="search" type="search" placeholder="Search courses">
    <p id="count"></p>
    <section id="courses">
      <article class="course">Java Programming</article>
      <article class="course">JavaScript Basics</article>
      <article class="course">Advanced CSS</article>
      <article class="course">Bootstrap Design</article>
      <article class="course">Spring Framework</article>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="course-search.js"></script>
</body>
</html>
