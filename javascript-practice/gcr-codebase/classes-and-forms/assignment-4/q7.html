<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login Validation</title></head>
<body>
  <form id="login-form" novalidate>
    <label>Username <input name="username" autocomplete="username"></label><small data-error="username"></small><br>
    <label>Password <input name="password" type="password" autocomplete="current-password"></label><small data-error="password"></small><br>
    <button>Sign in</button>
  </form>
  <p id="login-result" aria-live="polite"></p>
  <script src="q7.js"></script>
</body>
</html>
